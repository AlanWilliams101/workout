<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warmup Routine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            transition: background-color 0.5s ease;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            background-color: #212121;
        }
        .active-step { background-color: #2e7d32; }
        .idle { background-color: #212121; }
        .complete-screen { background-color: #1b5e20; }
        
        #station { font-size: 4.5rem; font-weight: bold; text-transform: uppercase; margin: 5px; }
        #intensity { font-size: 2rem; text-transform: uppercase; margin: 5px; padding: 0 20px; line-height: 1.2; }
        #timer { font-size: 8.5rem; font-weight: bold; font-family: monospace; line-height: 1; margin: 10px 0; }
        
        .voice-settings {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
        }

        .voice-settings select, .voice-settings input {
            font-size: 1rem;
            padding: 5px;
            border-radius: 5px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        button { 
            font-size: 1.5rem; 
            padding: 12px 30px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background: #fff; 
            color: #000; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #startBtn {
            font-size: 2rem;
            padding: 15px 40px;
        }

        /* Bulleted guide box placed at the BOTTOM */
        #explainer { 
            font-size: 1.3rem; 
            font-weight: bold; 
            background: rgba(0, 0, 0, 0.45); 
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin-top: 25px; 
            padding: 15px 30px; 
            max-width: 800px;
            width: 85%;
            color: #ffeb3b; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            text-align: left;
        }

        #explainer ul {
            margin: 0;
            padding-left: 20px;
        }

        #explainer li {
            margin-bottom: 5px;
        }

        #explainer li:last-child {
            margin-bottom: 0;
        }

        /* Dedicated Complete Screen Styling */
        #completeDisplay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .complete-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 20px 40px;
            margin: 20px 0;
            max-width: 600px;
        }

        .complete-card ul {
            text-align: left;
            font-size: 1.2rem;
            line-height: 1.8;
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
<body class="idle">

    <div id="mainDisplay">
        <div id="station">WARMUP ROUTINE</div>
        <div id="intensity">Press Start to Begin</div>
        <div id="timer">08:00</div>
    </div>

    <div id="completeDisplay">
        <div style="font-size: 5rem; font-weight: bold; color: #4caf50; text-shadow: 0 0 10px rgba(0,0,0,0.5);">✔ WARMUP COMPLETE</div>
        <div style="font-size: 2.2rem; margin-top: 10px;">READY FOR MAIN ENGINE WORKS</div>
        <div class="complete-card">
            <ul>
                <li><strong>Cardio Flush:</strong> Core Temp Raised</li>
                <li><strong>Dynamic Mobility:</strong> Spine, Hips & Shoulders Unlocked</li>
                <li><strong>Pattern Prep:</strong> Squats, Hinges & Plank Primes Done</li>
            </ul>
        </div>
        <button onclick="resetWarmup()" style="font-size: 1.5rem; margin-top: 10px;">RESTART WARMUP</button>
    </div>

    <div class="voice-settings" id="voicePanel">
        <div>
            <label for="voiceSelect">Voice: </label>
            <select id="voiceSelect"></select>
        </div>
        <div>
            <label for="rateSelect">Speed: </label>
            <input type="range" id="rateSelect" min="0.5" max="2" value="1.2" step="0.1">
        </div>
        <div>
            <label for="pitchSelect">Pitch: </label>
            <input type="range" id="pitchSelect" min="0.5" max="1.5" value="1.2" step="0.1">
        </div>
        <button onclick="testVoice()" style="font-size: 0.9rem; padding: 5px 10px;">Test</button>
    </div>

    <button id="startBtn" onclick="startWorkout()">START WARMUP</button>

    <div class="controls" id="controlPanel" style="display: none;">
        <button onclick="prevStation()">&#9664; PREV</button>
        <button id="pauseBtn" onclick="togglePause()">PAUSE</button>
        <button onclick="nextStationManually()">NEXT &#9654;</button>
        <button onclick="toggleFullScreen()">FULLSCREEN</button>
    </div>

    <div id="explainer" style="display: none;"></div>

    <script>
        const warmup = [
            { 
                station: "Cardio Flush", 
                zone: "2 Minutes Easy Pace (Row / Ski / Bike)", 
                bullets: [
                    "Light, smooth effort across your chosen engine",
                    "Focus on long, full breathing cycles",
                    "Gradually raise core temperature without fatigue"
                ], 
                duration: 120 
            },
            { 
                station: "Inchworms", 
                zone: "60 Seconds Controlled Movement", 
                bullets: [
                    "Keep legs relatively straight to stretch hamstrings",
                    "Walk hands out smoothly to a high plank position",
                    "Walk hands back toward feet and stand tall"
                ], 
                duration: 60 
            },
            { 
                station: "World's Greatest Stretch", 
                zone: "60 Seconds (Alternate Sides)", 
                bullets: [
                    "Step foot forward outside hands into a deep runner's lunge",
                    "Drop inside elbow down toward your ankle",
                    "Rotate torso and reach top arm upward to open chest"
                ], 
                duration: 60 
            },
            { 
                station: "Kettlebell Halos", 
                zone: "60 Seconds (Alternate Directions)", 
                bullets: [
                    "Hold KB upside down by horns close to chest",
                    "Trace tight circle around head passing behind neck",
                    "Keep head still and core tightly braced"
                ], 
                duration: 60 
            },
            { 
                station: "Air Squats", 
                zone: "60 Seconds Smooth Rhythm", 
                bullets: [
                    "Feet shoulder-width apart with chest tall",
                    "Push knees outward tracking over toes",
                    "Drive through mid-foot to stand up fully"
                ], 
                duration: 60 
            },
            { 
                station: "Cat-Cow Stretch", 
                zone: "60 Seconds Flow on Mat", 
                bullets: [
                    "Set up on hands and knees with flat back",
                    "Inhale: drop belly down and lift head (Cow)",
                    "Exhale: arch back toward ceiling and tuck chin (Cat)"
                ], 
                duration: 60 
            },
            { 
                station: "Down-Ups & Swings", 
                zone: "60 Seconds Light Prep", 
                bullets: [
                    "Down-Up: hands down, kick feet to plank, snap in, stand",
                    "KB Swing: hike back between legs, snap hips forward",
                    "Drive weight to chest height using glutes, not shoulders"
                ], 
                duration: 60 
            }
        ];

        let currentIndex = 0;
        let timeRemaining = 0;
        let timerInterval = null;
        let isPaused = false;
        let hasStarted = false;
        let availableVoices = [];

        function populateVoices() {
            if ('speechSynthesis' in window) {
                availableVoices = window.speechSynthesis.getVoices();
                const voiceSelect = document.getElementById('voiceSelect');
                voiceSelect.innerHTML = '';
                let selectedIndex = 0;
                availableVoices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    voiceSelect.appendChild(option);
                    if (voice.name.includes("Google UK English Female")) selectedIndex = index;
                });
                if (availableVoices.length > 0) voiceSelect.selectedIndex = selectedIndex;
            }
        }

        populateVoices();
        if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = populateVoices;

        function cleanSpeechText(text) {
            return text.replace(/\//g, " then ").replace(/-/g, " ").replace(/\s+/g, " ");
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanSpeechText(text));
                const voiceIndex = document.getElementById('voiceSelect').value;
                if (availableVoices[voiceIndex]) utterance.voice = availableVoices[voiceIndex];
                utterance.rate = parseFloat(document.getElementById('rateSelect').value);
                utterance.pitch = parseFloat(document.getElementById('pitchSelect').value);
                window.speechSynthesis.speak(utterance);
            }
        }

        function testVoice() { speak("Warmup Step 1: Cardio Flush. 2 minutes easy pace."); }

        function updateDisplay() {
            const step = warmup[currentIndex];
            document.getElementById('station').innerText = step.station;
            document.getElementById('intensity').innerText = step.zone;
            document.body.className = "active-step";
            
            const explainerEl = document.getElementById('explainer');
            if (step.bullets && step.bullets.length > 0) {
                explainerEl.innerHTML = "<ul>" + step.bullets.map(b => `<li>${b}</li>`).join('') + "</ul>";
                explainerEl.style.display = "block";
            } else {
                explainerEl.style.display = "none";
            }

            let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            let s = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function loadStation(index, announce = true) {
            if (index >= 0 && index < warmup.length) {
                currentIndex = index;
                timeRemaining = warmup[currentIndex].duration;
                updateDisplay();
                if (announce) speak(`${warmup[currentIndex].station}. ${warmup[currentIndex].zone}.`);
            } else if (index >= warmup.length) {
                clearInterval(timerInterval);
                document.getElementById('mainDisplay').style.display = "none";
                document.getElementById('completeDisplay').style.display = "flex";
                document.getElementById('explainer').style.display = "none";
                document.getElementById('controlPanel').style.display = "none";
                document.body.className = "complete-screen";
                speak("Warmup complete. You are primed and ready to start.");
            }
        }

        function startWorkout() {
            hasStarted = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('voicePanel').style.display = 'none';
            document.getElementById('controlPanel').style.display = 'flex';
            loadStation(0);
            timerInterval = setInterval(runTimer, 1000);
        }

        function resetWarmup() {
            clearInterval(timerInterval);
            hasStarted = false;
            isPaused = false;
            currentIndex = 0;
            document.getElementById('completeDisplay').style.display = "none";
            document.getElementById('mainDisplay').style.display = "block";
            document.getElementById('startBtn').style.display = "inline-block";
            document.getElementById('voicePanel').style.display = "flex";
            document.getElementById('station').innerText = "WARMUP ROUTINE";
            document.getElementById('intensity').innerText = "Press Start to Begin";
            document.getElementById('timer').innerText = "08:00";
            document.body.className = "idle";
        }

        function runTimer() {
            if (isPaused) return;
            timeRemaining--;
            updateDisplay();
            if (timeRemaining <= 3 && timeRemaining > 0) speak(timeRemaining.toString());
            if (timeRemaining <= 0) loadStation(currentIndex + 1);
        }

        function togglePause() {
            if (!hasStarted) return;
            isPaused = !isPaused;
            document.getElementById('pauseBtn').innerText = isPaused ? "RESUME" : "PAUSE";
            speak(isPaused ? "Paused" : "Resuming");
        }

        function prevStation() {
            if (!hasStarted) return;
            if (timeRemaining >= warmup[currentIndex].duration - 5) {
                if (currentIndex > 0) loadStation(currentIndex - 1);
                else loadStation(0);
            } else {
                loadStation(currentIndex, false);
            }
        }

        function nextStationManually() {
            if (!hasStarted) return;
            loadStation(currentIndex + 1);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); hasStarted ? togglePause() : startWorkout(); }
            if (e.code === 'ArrowRight') nextStationManually();
            if (e.code === 'ArrowLeft') prevStation();
        });
    </script>
</body>
</html>
